
name: Vehicle Detection CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.162.0
          python -m pip install uvicorn==0.54.0
          python -m pip install python-multipart==0.0.34
          python -m pip install pydantic==2.14.2
          python -m pip install pytest==9.2.0
          python -m pip install httpx==0.28.1

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v
